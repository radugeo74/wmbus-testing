# wM-Bus T1 RF test transmitter (separate from the receiver under test).
# Uses local ../components/sx126x in this repository.
# GPIO and TCXO values below are for a Heltec WiFi LoRa 32 V3-style pinout,
# NOT validated for any other ESP32-S3 + SX1262 board.
# This bench transmits ONLY on button press.
#
# TX uses fixed-length GFSK to avoid a packet-length byte before T1 symbols.
# The original sx126x transmit_packet() only accepts exactly payload_length
# bytes in fixed-length mode. Each button updates the length and reconfigures
# the radio before transmitting. This is suitable for manual lab tests.

esphome:
  name: wmbus-tx-lab
  friendly_name: wM-Bus T1 TX Lab
  includes:
    - <algorithm>
    - ../wmbus_tx_encoder.h

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Replace with actual wiring before flashing on a different board.
spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

external_components:
  - source:
      type: local
      path: ../components
    components: [sx126x]

sx126x:
  id: tx_radio
  hw_version: sx1262
  cs_pin: GPIO8
  rst_pin: GPIO12
  busy_pin: GPIO13
  dio1_pin: GPIO14
  rf_switch: true
  tcxo_voltage: 3_0V
  tcxo_delay: 5ms

  modulation: FSK
  frequency: 868950000
  bitrate: 100000
  deviation: 50000
  bandwidth: 234_3kHz
  shaping: NONE
  crc_enable: false
  whitening_enable: false
  sync_value: [0x54, 0x3D]
  preamble_size: 2
  preamble_detect: 2
  payload_length: 63
  rx_start: true
  pa_power: 2

button:
  - platform: template
    name: "Send Lansen PU test telegram"
    on_press:
      - lambda: |-
          const auto telegram =
              wmbus_tx::hex_to_bytes(wmbus_tx::kLansenPuTelegramHex);
          const auto payload = wmbus_tx::build_t1_tx_payload(telegram);
          if (payload.size() != 63) {
            ESP_LOGE("wmbus_tx", "Lansen: unexpected payload size %u",
                     static_cast<unsigned>(payload.size()));
            return;
          }

          // Reinitialize GFSK using fixed-length mode; do not send a
          // Semtech variable-length prefix before the T1 3-of-6 symbols.
          id(tx_radio)->set_payload_length(
              static_cast<uint8_t>(payload.size()));
          id(tx_radio)->configure();
          if (id(tx_radio)->is_failed()) {
            ESP_LOGE("wmbus_tx", "Lansen: SX1262 configuration failed");
            return;
          }
          const auto result = id(tx_radio)->transmit_packet(payload);
          if (result == esphome::sx126x::SX126xError::NONE) {
            ESP_LOGI("wmbus_tx", "Lansen PU T1 transmitted: 63 coded bytes, "
                                 "ID 00010206 (a_counter=4711, b_counter=1234)");
          } else {
            ESP_LOGE("wmbus_tx", "Lansen PU TX failed (result=%d)",
                     static_cast<int>(result));
          }

  - platform: template
    name: "Send FHKV data III test telegram"
    on_press:
      - lambda: |-
          const auto telegram =
              wmbus_tx::hex_to_bytes(wmbus_tx::kFhkvDataIIITelegramHex);
          const auto payload = wmbus_tx::build_t1_tx_payload(telegram);
          if (payload.size() != 92) {
            ESP_LOGE("wmbus_tx", "FHKV III: unexpected payload size %u",
                     static_cast<unsigned>(payload.size()));
            return;
          }

          id(tx_radio)->set_payload_length(
              static_cast<uint8_t>(payload.size()));
          id(tx_radio)->configure();
          if (id(tx_radio)->is_failed()) {
            ESP_LOGE("wmbus_tx", "FHKV III: SX1262 configuration failed");
            return;
          }
          const auto result = id(tx_radio)->transmit_packet(payload);
          if (result == esphome::sx126x::SX126xError::NONE) {
            ESP_LOGI("wmbus_tx", "FHKV III T1 transmitted: 92 coded bytes, "
                                 "ID 11776622 (current=131, previous=1026)");
          } else {
            ESP_LOGE("wmbus_tx", "FHKV III TX failed (result=%d)",
                     static_cast<int>(result));
          }
